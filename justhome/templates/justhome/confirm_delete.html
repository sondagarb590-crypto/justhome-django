{% extends 'justhome/base.html' %}
{% block title %}Delete Property - JustHome{% endblock %}

{% block content %}
<div style="padding-top:120px;" class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow p-5 text-center" style="border-radius:20px;">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem;"></i>
                <h4 class="fw-bold mt-3">Delete Property?</h4>
                <p class="text-muted">Are you sure you want to delete <strong>{{ property.title }}</strong>? This action cannot be undone.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex gap-3 justify-content-center mt-3">
                        <button type="submit" class="btn btn-danger rounded-pill px-4">Yes, Delete</button>
                        <a href="{% url 'property_detail' property.pk %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
